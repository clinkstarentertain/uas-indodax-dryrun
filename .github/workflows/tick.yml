# Scheduler eksternal cadangan: GitHub Actions tiap jam menit ke-7 (UTC = WIB-7; menit sama).
# Isi repository secrets: CRON_SECRET dan BOT_URL. Tidak ada secret di file ini.
name: tick-per-jam
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil /api/tick (maks 3 percobaan)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          for a in 1 2 3; do
            code=$(curl -s -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "$BOT_URL/api/tick" --max-time 90) || code=000
            echo "percobaan $a: HTTP $code $(cat out.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep $((20*a))
          done
          exit 1
